[workspace.package]
version = "2.22.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afflom/verdant-engine"
homepage = "https://afflom.github.io/verdant-engine/"
authors = ["Alex"]
keywords = ["game-engine", "3d", "tensor", "wasm", "gltf"]
categories = ["game-engines", "graphics", "simulation", "wasm"]

[workspace.dependencies]
prism-fidelity = { version = "2.22.1", path = "crates/fidelity" }
repo-model = { version = "2.22.1", path = "crates/model" }
repo-conformance = { version = "2.22.1", path = "crates/conformance" }
uor-matmul = { version = "0.1.0", git = "https://github.com/UOR-Foundation/uor-matmul", branch = "main", default-features = false }
uorc = { version = "0.6.0", git = "https://github.com/UOR-Foundation/compression", branch = "main" }
uorc_decompress = { version = "0.1.0", git = "https://github.com/UOR-Foundation/compression", branch = "main" }
verdant-tensor = { version = "2.22.1", path = "crates/verdant-tensor" }
verdant-core = { version = "2.22.1", path = "crates/verdant-core" }
verdant-wasm = { version = "2.22.1", path = "crates/verdant-wasm" }
verdant-cli = { version = "2.22.1", path = "crates/verdant-cli" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package.uorc]
opt-level = "z"

[profile.release.package.uorc_compress]
opt-level = "z"

[profile.release.package.uorc_decompress]
opt-level = "z"

[profile.dev.package.uorc]
opt-level = 2

[profile.test.package.uorc]
opt-level = 2

[profile.dev.package.uorc_compress]
opt-level = 1

[profile.test.package.uorc_compress]
opt-level = 1

[profile.dev.package.uorc_decompress]
opt-level = 1

[profile.test.package.uorc_decompress]
opt-level = 1

[profile.dev.package.verdant_quotient_f64]
opt-level = 2

[profile.dev.package.verdant_count_f64]
opt-level = 2

[profile.dev.package.verdant_division_norm]
opt-level = 2

[profile.test.package.verdant_scalar_f32]
opt-level = 2
