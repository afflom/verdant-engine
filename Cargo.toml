[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afflom/verdant-engine"
homepage = "https://afflom.github.io/verdant-engine/"
authors = ["Alex"]
keywords = ["game-engine", "3d", "webgpu", "wasm", "gltf"]
categories = ["game-engines", "graphics", "simulation", "wasm"]

[workspace.dependencies]
prism-fidelity = { version = "0.1.0", path = "crates/fidelity" }
repo-model = { version = "0.1.0", path = "crates/model" }
repo-conformance = { version = "0.1.0", path = "crates/conformance" }
verdant-core = { version = "0.1.0", path = "crates/verdant-core" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
