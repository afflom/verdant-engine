[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afflom/verdant-engine"
homepage = "https://afflom.github.io/verdant-engine/"
authors = ["Alex"]
keywords = ["game-engine", "3d", "tensor", "wasm", "gltf"]
categories = ["game-engines", "graphics", "simulation", "wasm"]

[workspace.dependencies]
prism-fidelity = { version = "0.1.0", path = "crates/fidelity" }
repo-model = { version = "0.1.0", path = "crates/model" }
repo-conformance = { version = "0.1.0", path = "crates/conformance" }
uor-matmul = { version = "0.1.0", git = "https://github.com/UOR-Foundation/uor-matmul", branch = "main", default-features = false }
uorc = { version = "0.6.0", git = "https://github.com/UOR-Foundation/compression", branch = "main" }
verdant-core = { version = "0.1.0", path = "crates/verdant-core" }
verdant-wasm = { version = "0.1.0", path = "crates/verdant-wasm" }
verdant-cli = { version = "0.1.0", path = "crates/verdant-cli" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package.uorc]
opt-level = 1
debug = false

[profile.dev.package.uorc_compress]
opt-level = 1
debug = false

[profile.dev.package.uorc_decompress]
opt-level = 1
debug = false

[profile.dev.package.uorc_search]
opt-level = 1
debug = false

[profile.test.package.uorc]
opt-level = 1
debug = false

[profile.test.package.uorc_compress]
opt-level = 1
debug = false

[profile.test.package.uorc_decompress]
opt-level = 1
debug = false

[profile.test.package.uorc_search]
opt-level = 1
debug = false
