      <div class="ve-viewport" data-slot="surface">
        <canvas id="ve-canvas" aria-label="Verdant Engine 3D studio viewport"></canvas>
        <div class="ve-hud" aria-hidden="true">
          <span id="ve-hud-lod" class="ve-pill">LOD2 · High Detail (0.625)</span>
          <span id="ve-hud-stats" class="ve-pill">WebGL2 · 15 kernels · CCD + IK</span>
        </div>
        <form id="ve-prompt-form" class="ve-prompt-bar" autocomplete="off">
          <input id="ve-prompt-input" type="text" aria-label="Direct engine via coded_gemm model" placeholder="Direct engine (lod4 hd, 1st person, create game, tile 16x16)…" />
          <button id="ve-prompt-btn" type="submit">Direct</button>
        </form>
        <input id="ve-glb-file" type="file" accept=".glb,model/gltf-binary" hidden />
      </div>
      <div class="result" id="game-status" data-slot="result" aria-live="polite">
        <span id="ve-status" class="chip chip-wait">Verifying engine…</span>
      </div>
      <div class="controls" data-slot="actions" data-label="Verdant Studio">
        <button id="ve-studio-btn" class="primary" type="button" title="Journeys, Outliner &amp; Game Scaffolder">Workbench</button>
        <button id="ve-sim-btn" type="button" aria-pressed="false" title="Toggle 60fps simulation">Sim: Step</button>
        <button id="ve-cam-btn" type="button" title="Cycle Orbit, 3rd IK, 1st Eye">Cam: Orbit</button>
        <button id="ve-lod-btn" type="button" title="Cycle LOD0..LOD4">LOD2</button>
        <button id="ve-uorc-btn" type="button" title="Stream .uorc in Wasm">Stream HD</button>
        <button id="ve-render-btn" type="button" title="WebGL2 or 16x16 tile PBR">WebGL2</button>
        <button id="ve-import-btn" type="button" title="Import .glb">+GLB</button>
        <button id="ve-glb-btn" type="button" title="Export .glb">Export .glb</button>
        <button id="ve-snap-btn" type="button" title="Share #uorc= snapshot">Share .uorc</button>
        <button id="ve-audio-btn" type="button" aria-pressed="false" title="Modal spatial audio">Audio</button>
        <button id="ve-mesh-btn" type="button" title="Prism ID &amp; Stitch shards">Stitch ID</button>
        <a id="ve-docs-link" class="ghost" href="./docs/">Docs</a>
      </div>
      <ol id="ve-telemetry" data-slot="history" data-label="Guided Journeys &amp; Landmarks"></ol>
