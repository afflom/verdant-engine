      <div class="ve-viewport" data-slot="surface">
        <canvas id="ve-canvas" aria-label="Verdant Engine 3D studio viewport"></canvas>
        <div class="ve-hud" aria-hidden="true">
          <span id="ve-hud-lod" class="ve-pill">LOD3 · Lossless UORC (1.00)</span>
          <span id="ve-hud-stats" class="ve-pill">WebGL2 · 12 kernels · LIF observer</span>
        </div>
        <form id="ve-prompt-form" class="ve-prompt-bar" autocomplete="off">
          <input id="ve-prompt-input" type="text" aria-label="Direct engine via embedded coded_gemm model" placeholder="Direct engine (drive vehicle, tile 16x16, focus observer, shard stitch)…" />
          <button id="ve-prompt-btn" type="submit">Direct</button>
        </form>
        <input id="ve-glb-file" type="file" accept=".glb,model/gltf-binary" hidden />
      </div>
      <div class="result" id="game-status" data-slot="result" aria-live="polite">
        <span id="ve-status" class="chip chip-wait">Verifying engine…</span>
      </div>
      <div class="controls" data-slot="actions" data-label="Verdant Studio">
        <button id="ve-lod-btn" class="primary" type="button" title="Cycle UORC LOD0..LOD3">LOD: LOD3</button>
        <button id="ve-uorc-btn" type="button" title="Stream .uorc in Wasm">.uorc</button>
        <button id="ve-render-btn" type="button" title="Switch WebGL2 and Wasm 16x16 tile PBR">WebGL2</button>
        <button id="ve-import-btn" type="button" title="Import binary .glb">+GLB</button>
        <button id="ve-studio-btn" type="button" title="Open Verdant Studio">Studio</button>
        <button id="ve-mesh-btn" type="button" title="Prism ID &amp; Stitch 2-of-3 custody">Mesh</button>
        <button id="ve-sim-btn" type="button" aria-pressed="false" title="Toggle 60fps simulation">Sim: Step</button>
        <button id="ve-cam-btn" type="button" title="Switch Orbit and WASD Walk">Orbit</button>
        <button id="ve-audio-btn" type="button" aria-pressed="false" title="Toggle modal spatial audio">Audio</button>
        <button id="ve-glb-btn" type="button" title="Export binary .glb">.glb</button>
        <button id="ve-snap-btn" type="button" title="Share #vdnt= SHA-256 snapshot">Snap</button>
        <a id="ve-docs-link" class="ghost" href="./docs/">Docs</a>
      </div>
      <ol id="ve-telemetry" data-slot="history" data-label="Semiring Kernels &amp; Nodes"></ol>
