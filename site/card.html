<div class="ve-viewport" data-slot="surface">
<canvas id="ve-canvas" aria-label="Verdant Engine 3D runtime stage — drag to orbit, scroll to zoom"></canvas>
<div class="ve-hud" aria-hidden="true">
<span id="ve-hud-lod" class="ve-pill">Verdant Engine · WebGL2 PBR · LOD2 High</span>
<span id="ve-hud-stats" class="ve-pill">WebGL2 PBR · 60 Hz · Clear 290mm</span>
</div>
<div id="ve-touch-pad" class="ve-touch-pad" role="group" aria-label="Character locomotion and narrative interaction">
<button type="button" data-move="KeyW" aria-label="W: Move forward">W</button>
<button type="button" data-move="KeyA" aria-label="A: Strafe left">A</button>
<button type="button" data-move="KeyS" aria-label="S: Move backward">S</button>
<button type="button" data-move="KeyD" aria-label="D: Strafe right">D</button>
<button type="button" id="ve-interact-btn" aria-label="E: Advance narrative beat">E</button>
<button type="button" id="ve-lock-btn">Look</button>
</div>
<form id="ve-prompt-form" class="ve-prompt-bar" autocomplete="off">
<span class="ve-prompt-tag" aria-hidden="true">Direct</span>
<input id="ve-prompt-input" type="text" aria-label="Direct the live 3D scene" placeholder="Direct scene (stone arch, 3rd person, LOD4, audio)…" />
<button id="ve-prompt-btn" type="submit">Go</button>
</form>
<input id="ve-glb-file" type="file" accept=".glb,model/gltf-binary" hidden />
</div>
<div class="result" id="game-status" data-slot="result" aria-live="polite">
<span id="ve-status" class="chip chip-wait">Starting 3D engine…</span>
</div>
<div class="controls" data-slot="actions" data-label="Platform &amp; Runtime Controls">
<nav class="ve-pillar-grid" aria-label="Verdant platform workspaces">
<a id="ve-studio-link" class="ghost ve-pillar ve-pillar-studio" href="./studio/">
<span class="ve-pillar-name">Verdant Studio</span>
<span class="ve-pillar-sub">3D App IDE</span>
</a>
<a id="ve-catalogs-link" class="ghost ve-pillar ve-pillar-catalogs" href="./catalogs/">
<span class="ve-pillar-name">Model Catalogs</span>
<span class="ve-pillar-sub">Assets &amp; Worlds</span>
</a>
<a id="ve-demo-link" class="ghost ve-pillar ve-pillar-demo" href="./demo/">
<span class="ve-pillar-name">Engine Demo</span>
<span class="ve-pillar-sub">UHD &amp; Benchmarks</span>
</a>
<a id="ve-docs-link" class="ghost ve-pillar ve-pillar-docs" href="./docs/">
<span class="ve-pillar-name">Documentation</span>
<span class="ve-pillar-sub">Guides &amp; API</span>
</a>
<a id="ve-frame-link" class="ghost ve-pillar ve-pillar-frame" href="./frame/?pin=stitch://verdant/studio">
<span class="ve-pillar-name">Blank Frame</span>
<span class="ve-pillar-sub">Stitch 4-of-8 Boot</span>
</a>
</nav>
<div class="ve-runtime-grid" role="group" aria-label="Live runtime controls">
<button id="ve-sim-btn" class="primary" type="button" aria-pressed="false">Play Preview</button>
<button id="ve-cam-btn" type="button">View: Orbit</button>
<button id="ve-lod-btn" type="button">Detail: High</button>
<button id="ve-audio-btn" type="button" aria-pressed="false">Sound: Off</button>
</div>
<details id="ve-io-drawer" class="ve-io-drawer">
<summary class="ve-io-summary">Import, Export &amp; Share</summary>
<div class="ve-io-tray">
<button id="ve-uorc-btn" type="button">Stream LOD4 HD</button>
<button id="ve-render-btn" type="button">Raster: WebGL2</button>
<button id="ve-import-btn" type="button">Import .glb</button>
<button id="ve-glb-btn" type="button">Export .glb</button>
<button id="ve-snap-btn" type="button">Copy #uorc URL</button>
<button id="ve-mesh-btn" type="button">Stitch Custody</button>
<button id="ve-studio-btn" type="button">Dock Studio</button>
</div>
</details>
</div>
<ol id="ve-telemetry" data-slot="history" data-label="Modeled Runtime Strata"></ol>
