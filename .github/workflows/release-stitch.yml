# Verdant Self-Hosted Stitch Release & Optional GitHub Packages Distribution (`VE-44`).
# Packs verdant-vX.Y.Z.holo + 4-of-8 STCH2 shards, gates EVERY release on live headless Chromium
# pull-through verification through the immutable <= 30 KiB Blank Frame with 4 of 8 shards withheld,
# packages optional Rust library .crate files + RFC 2789 sparse index, pushes to GitHub Packages
# (ghcr.io), and publishes a GitHub Release (automatically triggering Zenodo DOI archival).
name: stitch-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without leading v (e.g. 2.1.0)"
        required: false
        default: ""
      epoch:
        description: "Strictly monotonic Stitch release epoch (>= 1)"
        required: false
        default: ""
      publish:
        description: "Publish GitHub Release, ghcr.io OCI bundle & stitch-mirror branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  pack-verify-and-publish:
    name: Pack, Chromium Pull-Through Gate & Publish (.holo + Rust Crates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version and epoch from Change Manager ledger
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ledger_ver=$(node -e 'const l=JSON.parse(require("fs").readFileSync("site/generated/release-ledger.json","utf8")); console.log(`${l.currentVersion.major}.${l.currentVersion.minor}.${l.currentVersion.patch}`)')
          ledger_epoch=$(node -e 'const l=JSON.parse(require("fs").readFileSync("site/generated/release-ledger.json","utf8")); console.log(l.releaseEpoch)')
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="${{ github.event.inputs.version || '' }}"
            ver="${ver:-$ledger_ver}"
          fi
          epoch="${{ github.event.inputs.epoch || '' }}"
          epoch="${epoch:-$ledger_epoch}"
          printf 'version=%s\nepoch=%s\n' "$ver" "$epoch" >> "$GITHUB_OUTPUT"

      - name: Qualify release version sync, frontier register & green bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release/qualify-tag.mjs --tag "v${{ steps.meta.outputs.version }}" --sha "${GITHUB_SHA}"

      - name: Build verdant CLI, lift full Source DAG & pack self-verifying .holo + 4-of-8 STCH2 shards
        shell: bash
        run: |
          set -euo pipefail
          owner_lc=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ver="${{ steps.meta.outputs.version }}"
          cargo build --locked -p verdant-cli --bin verdant
          ./target/debug/verdant operator kpis --root .
          ./target/debug/verdant release self-host \
            --root . \
            --version "$ver" \
            --epoch "${{ steps.meta.outputs.epoch }}" \
            --out dist/stitch-release
          ./target/debug/verdant release pack \
            --root . \
            --version "$ver" \
            --epoch "${{ steps.meta.outputs.epoch }}" \
            --out dist/stitch-release \
            --relay "https://${owner_lc}.github.io/verdant-engine/stitch/v${ver}/shards" \
            --relay "https://cdn.jsdelivr.net/gh/${owner_lc}/verdant-engine@stitch-mirror/v${ver}/shards" \
            --relay "https://raw.githubusercontent.com/${owner_lc}/verdant-engine/stitch-mirror/v${ver}/shards" \
            --pin "stitch://verdant/studio"
          ./target/debug/verdant release verify --dir dist/stitch-release

      - name: Mandatory Chromium Pull-Through Blank Frame Verification Gate (4 of 8 shards withheld)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install chromium
          node scripts/verify-stitch-release.mjs --dir dist/stitch-release

      - name: Package & verify Rust library .crate files & RFC 2789 Cargo sparse index
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-rust-crates.mjs \
            --out dist/crates \
            --dl "https://github.com/${{ github.repository }}/releases/download/v{version}/{crate}-{version}.crate"
          node scripts/verify-sparse-registry.mjs --dir dist/crates

      - name: Publish CORS-verified Stitch shards to orphan stitch-mirror branch (jsDelivr + raw.githubusercontent)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mirror_tmp=$(mktemp -d)
          trap 'rm -rf "$mirror_tmp"' EXIT
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ls_out=""
          ls_rc=0
          for attempt in 1 2 3; do
            set +e
            ls_out=$(git ls-remote --heads "$remote_url" stitch-mirror 2>&1)
            ls_rc=$?
            set -e
            if [[ $ls_rc -eq 0 ]]; then
              break
            fi
            echo "stitch-mirror ls-remote attempt ${attempt} failed (rc=${ls_rc}): ${ls_out}" >&2
            sleep $((attempt * 3))
          done
          if [[ $ls_rc -ne 0 ]]; then
            echo "fatal: could not query remote stitch-mirror after 3 attempts" >&2
            exit "$ls_rc"
          fi
          if [[ -n "$ls_out" ]]; then
            git clone --depth 1 --branch stitch-mirror "$remote_url" "$mirror_tmp"
          else
            git init -b stitch-mirror "$mirror_tmp"
            git -C "$mirror_tmp" remote add origin "$remote_url"
          fi
          mkdir -p "$mirror_tmp/v${VER}/shards"
          cp dist/stitch-release/shards/*.stch "$mirror_tmp/v${VER}/shards/"
          cp dist/stitch-release/frame-pin.json "$mirror_tmp/v${VER}/frame-pin.json"
          git -C "$mirror_tmp" config user.name "verdant-release-bot"
          git -C "$mirror_tmp" config user.email "verdant-release-bot@users.noreply.github.com"
          git -C "$mirror_tmp" add "v${VER}"
          if ! git -C "$mirror_tmp" diff --cached --quiet; then
            git -C "$mirror_tmp" commit -m "Mirror CORS-verified 4-of-8 STCH2 shards for Verdant v${VER}"
            for attempt in 1 2 3; do
              if git -C "$mirror_tmp" push origin stitch-mirror; then
                break
              fi
              if [[ $attempt -eq 3 ]]; then
                exit 1
              fi
              sleep $((attempt * 3))
              git -C "$mirror_tmp" pull --rebase origin stitch-mirror || true
            done
          fi

      - name: Publish .holo release capsule & Rust crates to GitHub Packages (ghcr.io) and GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OWNER_LOWER: ${{ github.repository_owner }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_LC=$(printf '%s' "$OWNER_LOWER" | tr '[:upper:]' '[:lower:]')
          # Publish GitHub Release with portable .holo capsule, self-hosted Source DAG .uorc,
          # frame-pin.json, 4-of-8 STCH2 shards & optional Rust .crate archives.
          # (Creating a GitHub Release automatically triggers Zenodo DOI archival with zero Verdant config.)
          RELEASE_ASSETS=(
            "dist/stitch-release/verdant-v${VER}.holo"
            "dist/stitch-release/verdant-source-v${VER}.uorc"
            "dist/stitch-release/self-host-lift.json"
            "dist/stitch-release/vcs-v${VER}.uorc"
            "dist/stitch-release/frame-pin.json"
            dist/stitch-release/shards/*.stch
            dist/stitch-release/source-shards/*.stch
            dist/crates/crates/*.crate
            dist/crates/crates-manifest.json
          )
          gh release create "v${VER}" "${RELEASE_ASSETS[@]}" \
            --title "Verdant Engine v${VER} (Self-Hosted Stitch .holo + Rust Crates)" \
            --notes "Verified via mandatory Chromium Pull-Through Blank Frame Gate (4-of-8 GF(2^8) Reed-Solomon recovery with 4 shards withheld, 0 loose UI files) and 13-Manager Total Ownership (9/9 Prism Facets, 8/8 ISO 15939 KPIs). Includes portable verdant-v${VER}.holo capsule, verdant-source-v${VER}.uorc full Source DAG, 8+8 STCH2 shards, frame-pin.json, and 4 Rust .crate packages." \
            || gh release upload "v${VER}" "${RELEASE_ASSETS[@]}" --clobber

          # Push immutable OCI release bundle (.holo + Source DAG + shards + Rust crates & RFC 2789 sparse index)
          # to GitHub Packages (ghcr.io) via standard Docker build & push.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$OWNER_LC" --password-stdin
          mkdir -p dist/oci-bundle
          cp "dist/stitch-release/verdant-v${VER}.holo" \
             "dist/stitch-release/verdant-source-v${VER}.uorc" \
             "dist/stitch-release/frame-pin.json" \
             "dist/stitch-release/self-host-lift.json" \
             dist/oci-bundle/
          cp -r dist/stitch-release/shards dist/oci-bundle/shards
          cp -r dist/crates dist/oci-bundle/crates
          printf 'FROM scratch\nCOPY . /verdant/\n' > dist/oci-bundle/Dockerfile
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VER}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "ghcr.io/${OWNER_LC}/verdant-engine/verdant-release:v${VER}" \
            -t "ghcr.io/${OWNER_LC}/verdant-engine/verdant-release:latest" \
            dist/oci-bundle
          docker push "ghcr.io/${OWNER_LC}/verdant-engine/verdant-release:v${VER}"
          docker push "ghcr.io/${OWNER_LC}/verdant-engine/verdant-release:latest"
