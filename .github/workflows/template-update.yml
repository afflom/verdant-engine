name: propose template update

on:
  workflow_dispatch:
    inputs:
      template-revision:
        description: Reviewed 40-character UOR-Foundation/template policy-input revision.
        required: true
        type: string

permissions: {}

jobs:
  proposal:
    name: generate the proposal without write credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the protected downstream branch without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Check out the exact reviewed template policy snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: UOR-Foundation/template
          ref: ${{ inputs.template-revision }}
          path: .template-policy
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Render the complete proposal from immutable inputs
        env:
          TEMPLATE_REVISION: ${{ inputs.template-revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $TEMPLATE_REVISION =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .template-policy rev-parse HEAD)" = "$TEMPLATE_REVISION"
          for path in AGENTS.md VERIFICATION.md template-contract.json template.lock; do
            install -D -m 0644 ".template-policy/$path" "$path"
          done
          rm -r -- .template-policy
          node -e 'import("./try/vendor/prism-code/src/contract.mjs").then(({checkContract})=>{const d=checkContract(".");if(d.length){console.error(d);process.exit(1);}})'
          git add -N -- AGENTS.md VERIFICATION.md template-contract.json template.lock
          git diff --check
          git diff --binary >.template-update.patch
          test -s .template-update.patch
      - name: Preserve the inert reviewable patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: template-update-proposal
          if-no-files-found: error
          path: .template-update.patch
          include-hidden-files: true
          retention-days: 1

  open-pull-request:
    name: open the proposal without executing it
    needs: proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: template-update
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the protected default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Restore and apply the inert proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: template-update-proposal
      - name: Validate and apply the proposed patch without executing it
        run: |
          git apply --check .template-update.patch
          git apply .template-update.patch
          rm .template-update.patch
      - name: Open the patch as a pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          branch: automation/template-contract-update
          commit-message: "chore: update locked UOR template contract"
          delete-branch: true
          title: "chore: update locked UOR template contract"
          body: |
            Generated from an exact reviewed template revision under uor/template-contract/2.
            Review the complete policy patch and require every repository gate before merge.
