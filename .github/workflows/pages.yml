# Publishes the repository's app page (`site/`) containerlessly using `prism-code@0.11.1` (`M29`):
#   1. Restores or builds + offline-reproves (`reproveHere` + `relexHere`) Holo v6 `site/app.holo`
#      and self-carrying `site/generated/stitch-proof.holo` with zero 24 GB SDK container pulls.
#   2. Signs the holo's provenance via GitHub Attestations.
#   3. Assembles `site/`, verifies Lighthouse 100, M3 screens, Diataxis content, FR-03 cold-boot
#      weight, and 4-of-8 Stitch pull-through + embedded Holo v6 proof record in Chromium.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build and verify the holo, sign its provenance, assemble the page
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check the brand, the frame, and the template v2 contract
        shell: bash
        run: |
          set -euo pipefail
          node bootstrap/brand-sync.mjs --check
          python3 -I bootstrap/brand-fonts.py --check
          node bootstrap/frame-sync.mjs --check
          node -e 'import("./try/vendor/prism-code/src/contract.mjs").then(({checkContract})=>{const d=checkContract(".");if(d.length){console.error(d);process.exit(1);}})'
      - name: Restore cached Wasm LexLean and Lean 4.32.2 kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.prism
          key: pages-prism-wasm-${{ runner.os }}-${{ hashFiles('try/vendor/prism-code/src/journey/lexlean-wasm.mjs', 'try/vendor/prism-code/src/journey/model-prove.mjs') }}
      - name: Look up this build by its input kappa
        id: cache
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/kappa-cache.mjs restore app/.prism/build/kappa/app.holo app Justfile template.lock
      - name: Build and offline-reprove Holo v6 containerlessly via prism-code
        if: steps.cache.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/.prism/build/v6
          node scripts/build-holo-v6.mjs --out app/.prism/build/v6/app.holo --proof-out site/generated/stitch-proof.holo
      - name: Find the holo
        id: holo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          holos=(app/.prism/build/*/*.holo)
          if [[ ${#holos[@]} -ne 1 ]]; then
            printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
            exit 64
          fi
          fingerprint=$(node -e 'const b=require("fs").readFileSync(process.argv[1]);process.stdout.write(b.subarray(b.length-32).toString("hex"))' "${holos[0]}")
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"
      - name: Store this build under its input kappa
        if: steps.cache.outputs.hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOLO: ${{ steps.holo.outputs.path }}
          KAPPA: ${{ steps.cache.outputs.kappa }}
        run: node ci/kappa-cache.mjs save "$HOLO"
      - name: Sign the holo's provenance as this repository's workflow
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false
      - name: Draw the social image and the icons for this app.json
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/draw"
          "$RUNNER_TEMP/draw/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r bootstrap/draw-requirements.txt
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/og.py
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/icons.py
      - name: Assemble the page
        shell: bash
        env:
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$HOLO" site/app.holo
          node scripts/build-holo-v6.mjs --reprove site/generated/stitch-proof.holo --require-sources
          cp -r try/vendor site/vendor
          rm -rf site/vendor/prism-code/fixtures
          mkdir -p site/starter
          cp templates/browser-3d-starter/index.html site/starter/index.html
          cp templates/browser-3d-starter/game.mjs site/starter/game.mjs
          cp catalogs/domains/world-packs.json site/catalogs/world-packs.json
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [id, url] = process.argv.slice(1);
            const app = JSON.parse(readFileSync("site/app.json", "utf8"));
            app.attestations ??= {};
            app.attestations.build = { id, url };
            writeFileSync("site/app.json", `${JSON.stringify(app, null, 2)}\n`);
          ' "$FINGERPRINT" "$ATTESTATION_URL"
          node bootstrap/page.mjs site
          node bootstrap/precache.mjs site
          owner_lc=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          node scripts/package-rust-crates.mjs --out site/crates --dl "https://${owner_lc}.github.io/verdant-engine/crates/crates/{crate}-{version}.crate"
          node scripts/verify-sparse-registry.mjs --dir site/crates
          node scripts/enforce-prism-contracts.mjs
      - name: Restore cached Playwright & Lighthouse CI tools
        id: browser-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm-ci-tools
          key: pages-browser-tools-${{ runner.os }}-pw1.56.1-lhci0.15.1-v1
      - name: Lighthouse at 100 on mobile, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.npm-ci-tools"
          export PATH="$HOME/.npm-ci-tools/bin:$PATH"
          if ! command -v lhci >/dev/null 2>&1; then
            npm install --no-audit --no-fund --global @lhci/cli@0.15.1
          fi
          lhci autorun --config=lighthouserc.json
      - name: Every Material 3 window size class, both themes, live surfaces, and Diataxis docs, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.npm-ci-tools"
          export PATH="$HOME/.npm-ci-tools/bin:$PATH"
          export NODE_PATH="$HOME/.npm-ci-tools/lib/node_modules"
          if [ ! -d "$HOME/.npm-ci-tools/lib/node_modules/playwright" ]; then
            npm install --no-audit --no-fund --global playwright@1.56.1
          fi
          if [ "${{ steps.browser-tools-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi
          node scripts/content/check.mjs site
          rm -f site/content-report.json site/content-report.md
          node bootstrap/screens.mjs site screens
          node scripts/verify-live-surfaces.mjs site
      - name: A first visit's weight, counted once the page has started (FR-03)
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.npm-ci-tools"
          export PATH="$HOME/.npm-ci-tools/bin:$PATH"
          export NODE_PATH="$HOME/.npm-ci-tools/lib/node_modules"
          node bootstrap/weight.mjs site
      - name: Pack Stitch 4-of-8 shards for live Blank Frame pull-through & run Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.npm-ci-tools"
          export PATH="$HOME/.npm-ci-tools/bin:$PATH"
          export NODE_PATH="$HOME/.npm-ci-tools/lib/node_modules"
          ver=$(node -e 'const l=JSON.parse(require("fs").readFileSync("site/generated/release-ledger.json","utf8")); console.log(`${l.currentVersion.major}.${l.currentVersion.minor}.${l.currentVersion.patch}`)')
          epoch=$(node -e 'const l=JSON.parse(require("fs").readFileSync("site/generated/release-ledger.json","utf8")); console.log(l.releaseEpoch)')
          owner_lc=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cargo build --locked -p verdant-cli --bin verdant
          ./target/debug/verdant release pack \
            --root . \
            --version "$ver" \
            --epoch "$epoch" \
            --out "site/stitch/v${ver}" \
            --relay "https://${owner_lc}.github.io/verdant-engine/stitch/v${ver}/shards" \
            --relay "https://cdn.jsdelivr.net/gh/${owner_lc}/verdant-engine@stitch-mirror/v${ver}/shards" \
            --relay "https://raw.githubusercontent.com/${owner_lc}/verdant-engine/stitch-mirror/v${ver}/shards" \
            --pin "stitch://verdant/studio"
          cp "site/stitch/v${ver}/frame-pin.json" site/frame/frame-pin.json
          ./target/debug/verdant gateway pack \
            --root . \
            --release-dir "site/stitch/v${ver}" \
            --out "dist/pages-gateway"
          ./target/debug/verdant gateway verify --dir "dist/pages-gateway"
          cp "dist/pages-gateway/gateway-manifest.json" site/gateway-manifest.json
          cp -r "dist/pages-gateway/part" site/part
          node scripts/verify-stitch-release.mjs --dir "site/stitch/v${ver}"
          node scripts/verify-uhd-workload.mjs site
      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    name: publish the page
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
