# Minimal human-reviewed trust root (`uor/template-contract/2`, M29):
#   1. Zero-runner draft PR gating (#600): draft pull requests skip runner allocation.
#   2. Independent vs. proof-dependent CI lane splitting (#603):
#      - `fast-gate`: containerless format, model, template v2 contract, experience,
#        fidelity, clippy, cargo-deny, and JS/Prism contract checks.
#      - `proof-and-test`: digest-pinned LexLean 0.4.5 (`leanprover/lean4:v4.32.2`)
#        kernel proof + containerless Holo v6 offline reprove/relex + workspace test suite
#        on amd64 for PRs/merge_group and both native amd64 + arm64 for main and tags.
name: bootstrap

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('bootstrap-pr-{0}', github.event.pull_request.number) || format('bootstrap-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-gate:
    name: fast-gate / ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Restore cached Cargo tools and dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/just
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fast-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install locked Rust toolchain, just, and cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          tc=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal --component rustfmt --component clippy
          rustup default "$tc"
          command -v just >/dev/null 2>&1 || cargo install --locked just@1.40.0
          command -v cargo-deny >/dev/null 2>&1 || cargo install --locked cargo-deny@0.18.2
      - name: Run containerless independent fast gate
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          just fmt-check
          just model
          just template-check
          python3 -I scripts/experience/authority.py . --check
          just fidelity
          just lint
          just deny

  proof-and-test:
    name: acceptance / ${{ matrix.runner }}
    needs: fast-gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Name the LexLean image digest and the Lean toolchain the proof runs on
        id: proof-inputs
        shell: bash
        run: |
          set -euo pipefail
          lexlean_img=$(sed -n 's/.*"image": *"ghcr\.io\/uor-foundation\/lexlean@sha256:\([0-9a-f]\{64\}\)".*/\1/p' .devcontainer/devcontainer.json)
          lean=$(sed -n 's/^leanprover\/lean4:\(v[0-9A-Za-z.-]*\)$/\1/p' app/lean-toolchain)
          test -n "$lexlean_img"
          test -n "$lean"
          printf 'lexlean=%s\nlean=%s\n' "$lexlean_img" "$lean" >>"$GITHUB_OUTPUT"
      - name: The proof of these exact proof inputs, kept by an earlier run
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .prism-proof
            ~/.prism
            ~/.cargo/bin/just
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: prism-proof-${{ runner.os }}-${{ runner.arch }}-lexlean-${{ steps.proof-inputs.outputs.lexlean }}-lean-${{ steps.proof-inputs.outputs.lean }}-${{ hashFiles('app/**', 'template.lock', 'Justfile', 'rust-toolchain.toml', 'scripts/build-holo-v6.mjs') }}
      - name: Install locked Rust toolchain, just, and digest-pinned LexLean 0.4.5 CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${RUNNER_ENVIRONMENT:-} == github-hosted && ${RUNNER_OS:-} == Linux ]]; then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          tc=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal --target wasm32-unknown-unknown
          rustup default "$tc"
          command -v just >/dev/null 2>&1 || cargo install --locked just@1.40.0
          image=$(sed -n 's/.*"image": *"\([^"]*\)".*/\1/p' .devcontainer/devcontainer.json)
          if [[ ! $image =~ ^ghcr\.io/uor-foundation/lexlean@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' '.devcontainer/devcontainer.json does not select an immutable LexLean image' >&2
            exit 64
          fi
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/lexlean" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          scratch=\$(mktemp -d)
          trap 'rm -rf "\$scratch"' EXIT
          exec docker run --rm --network none -u "\$(id -u):\$(id -g)" -v "$PWD:$PWD" -v "\$scratch:/tmp" -w "\$PWD" -e HOME=/tmp "$image" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/lexlean"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run kernel proof gate, Holo v6 offline reprove/relex, and workspace test suite
        shell: bash
        env:
          PRISM_PROOF_EVENT: ${{ github.event_name }}:${{ github.ref }}
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          lexlean --version
          just experience-check
          just app
          just test
