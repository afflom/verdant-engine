name: Verdant language instance
on:
  pull_request:
    paths: ['instances/language/**', '.github/workflows/language.yml']
  push:
    branches: [main]
    paths: ['instances/language/**', '.github/workflows/language.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Materialize verified text model, engine and Prism
        run: |
          python3 instances/language/prepare.py
          bash instances/language/build.sh
      - name: Run text generation in Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cd instances/language
          python3 -m http.server 8751 --bind 127.0.0.1 &
          trap 'kill $!' EXIT
          curl --retry 10 --retry-connrefused -fsS http://127.0.0.1:8751/ -o /dev/null
          node verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verdant-language
          path: instances/language
          if-no-files-found: error
