[package]
name = "verdant-core"
description = "Universal 3D browser and WebAssembly game engine powered by Prism tensor kernels, UORC high-resolution streaming, physically based rendering, Khronos glTF 2.0, rigid-body physics, skeletal animation, navmesh pathfinding, and spatial audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["uorc-streaming"]
uorc-streaming = ["dep:uorc"]

[dependencies]
gltf = "1.4.1"
naga = { version = "30.0.2", features = ["wgsl-in"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.1"
uor-matmul.workspace = true
uorc = { workspace = true, optional = true }

[lints]
workspace = true
