[package]
name = "verdant-core"
description = "Universal 3D browser and WebAssembly game engine powered by Prism tensor kernels, UORC high-resolution streaming, physically based rendering, Khronos glTF 2.0, rigid-body physics, skeletal animation, navmesh pathfinding, and spatial audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["uorc-streaming", "uorc-wasm-decode", "uorc-ncm-decode", "wgsl-oracle", "capsule-gzip", "gltf-image-decode"]
uorc-streaming = ["dep:uorc", "uorc-wasm-decode", "uorc-ncm-decode"]
uorc-wasm-decode = []
uorc-ncm-decode = ["dep:uorc_decompress"]
wgsl-oracle = ["dep:naga"]
capsule-gzip = ["dep:flate2"]
gltf-image-decode = ["gltf/import"]

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"], optional = true }
gltf = { version = "1.4.1", default-features = false, features = ["extras", "names", "utils"] }
naga = { version = "30.0.2", features = ["wgsl-in", "glsl-out"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.11.0"
sha2 = "0.11.1"
uor-matmul.workspace = true
uorc = { workspace = true, optional = true }
uorc_decompress = { workspace = true, optional = true }
verdant-tensor.workspace = true

[lints]
workspace = true
