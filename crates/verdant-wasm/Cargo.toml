[package]
name = "verdant-wasm"
description = "Safe WebAssembly simulation, physics, spatial acoustics, and authenticated VDNT world-snapshot bridge over verdant-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
uorc-decoder = ["verdant-core/uorc-streaming", "verdant-core/uorc-wasm-decode"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
verdant-core.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
verdant-core = { version = "2.1.0", path = "../verdant-core", default-features = false }

[lints]
workspace = true
