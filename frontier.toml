# The lift register, written by uorust: every function of product code by
# the κ of its question (crate path and normalized tokens). A lifted κ is a
# proved claim; a later projection that decides it unlifted is refused.
# [lift] counts the functions by table, and each [[construct]] row is what
# stops the functions it counts (the detail their rows state, under its
# cause), the one that stops the most first: the work queue.

# Honesty report: 515 of 1833 functions of product code are lifted; 1161
# are residue, 75 foreign and 82 effect rows.
# Residue by cause:
#   arithmetic: 30
#   call: 213
#   form: 344
#   signature: 71
#   statements: 21
#   type: 476
#   width: 6

