# Permanent Zero-Constants & 100% Self-Hosting Parametric Ratchet (FI-08, VE-47).
# Every ceiling is permanently locked at 0 so no magic constants, ungrounded LexLean
# strata, non-constructive Classical.choice axioms, unlifted UI/workspace modules,
# loose Blank Frame files, or user-required external accounts can ever enter.
spec = "prism/parametric-ratchet/2"
ontology_root = "app/src/Foundation/Ontology/V1/Model.lex.tex"
engine_rust_root = "crates/verdant-core/src"
additional_rust_roots = [
  "crates/verdant-tensor/src",
  "crates/verdant-wasm/src",
  "crates/verdant-cli/src",
]
pure_zero_one_lex_modules = [
  "app/src/Foundation/Ontology/V1/Model.lex.tex",
  "app/src/Tensor.lex.tex",
  "app/src/Subsystems.lex.tex",
  "app/src/DevRel.lex.tex",
  "app/src/Observer.lex.tex",
  "app/src/Cadence.lex.tex",
  "app/src/Release.lex.tex",
  "app/src/Measures.lex.tex",
  "app/src/Production/ThreatModel.lex.tex",
]

[ceilings]
max_ontology_root_literal_gt_one_count = 0
max_ontology_root_string_field_count = 0
max_classical_choice_count = 0
max_ungrounded_lex_module_count = 0
max_domain_lex_magic_literal_count = 0
max_engine_rust_magic_literal_count = 0

[self_hosting]
blank_frame_dir = "site/frame"
max_blank_frame_bytes = 30720
allowed_blank_frame_files = [
  "index.html",
  "frame-boot.mjs",
  "frame-sw.js",
  "frame-pin.json",
]
ratchet_manifest = "site/generated/self-host-ratchet-manifest.toml"
immutability_seal = "site/generated/immutability-seal.json"
lifted_viewpoint_files = [
  "site/card.html",
  "site/studio/index.html",
  "site/catalogs/index.html",
  "site/demo/index.html",
  "site/docs/index.html",
  "templates/browser-3d-starter/index.html",
]
max_unlifted_ui_files = 0
max_unverified_frame_assets = 0
max_user_required_external_accounts = 0
max_unlifted_workspace_modules = 0

[frontier_ratchet]
frontier_register = "frontier.toml"
frontier_rust_tree_sha256 = "ef57e4d510f5921d975c11f2230468e0258bb4833e2d646edccfcf5d9283701e"
min_lifted_functions = 267
max_residue_functions = 1178
max_uncertified_functions = 1334

[surface_ratchet]
wasm_core_path = "site/verdant-wasm.wasm"
max_wasm_core_bytes = 159744
wasm_uorc_path = "site/verdant-uorc.wasm"
max_wasm_uorc_bytes = 4665344
frame_pin_path = "site/frame/frame-pin.json"
max_release_capsule_bytes = 1712128
max_handwritten_rust_file_lines = 2184
rust_line_exclude = ["crates/verdant-tensor/src/prism_kernel.rs"]
js_surface_roots = ["site"]
js_line_exclude_prefixes = ["site/vendor/", "site/crates/"]
max_js_file_lines = 1524

