method = "Measures::journeysPerStakeholder"
source = "app/src/Measures.lex.tex"
direction = "atLeast"

[[measure]]
record = "Quality::measureMagicConstantViolations"
method = "Measures::magicConstantViolations"
source = "app/src/Measures.lex.tex"
direction = "atMost"

[[measure]]
record = "Quality::measureVerifierRequestCapBytes"
method = "Measures::verifierRequestCapBytes"
source = "app/src/Measures.lex.tex"
direction = "atMost"

[[measure]]
