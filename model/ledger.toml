# model/ledger.toml --- the honesty ledger for claims that are not conformance
# IDs (R2).
#
# The conformance IDs and their levels live in `model/ids.toml`, which is the
# register; duplicating them here would give a claim two sources, which is
# exactly what R1 forbids. What remains is the two kinds of claim that have no
# ID: the facts this repository *reproduces* from an authority, and the
# quantities it *measures* and never asserts.
#
# The meta-gate proves the suite never asserts an `open` claim as established,
# and `CM-03` proves every `some-true` row cites an authority that exists.
#
# The ledger is empty. A claim added here needs its level chosen first, because
# the level decides what evidence it owes.

spec = "template/1"

[[claim]]
id = "AUTH-CL-01"
level = "some-true"
authority = "AUTH-SCHEMA-ORG"
statement = "Schema.org class subsumption and domainIncludes/rangeIncludes rules couple 3DModel, VideoGame, SoftwareApplication, Person, Place, IndividualProduct, and CommunicateAction graphs"

[[claim]]
id = "AUTH-CL-02"
level = "some-true"
authority = "AUTH-W3C-SOSA-PROVO"
statement = "W3C SOSA Observations require madeBySensor, hasFeatureOfInterest, and a result literal or IRI, and W3C PROV-O Entity derivations form an acyclic graph"

[[claim]]
id = "AUTH-CL-03"
level = "some-true"
authority = "AUTH-KHRONOS-GLTF2"
statement = "Khronos glTF 2.0 binary containers align JSON and BIN chunks to 4 bytes and bind skeletal skins via JOINTS_0, WEIGHTS_0, and MAT4 inverseBindMatrices alongside ratified PBR extensions"

[[claim]]
id = "AUTH-CL-04"
level = "some-true"
authority = "AUTH-ISO-24617-DMN"
statement = "ISO 24617-2 dialogue acts separate read-only epistemic inform/question/abstain turns from world-mutating requests and offers under OMG DMN 1.5 FIRST-hit model admission"

[[claim]]
id = "AUTH-CL-05"
level = "some-true"
authority = "AUTH-DOMAIN-PACKS"
statement = "Imported domain packs differentiate coastal, observatory, botanical, and arena worlds across terrain relief, Sabine acoustics, HD models, items, and character profiles"
